name: morning horoscope
on:
  schedule:
    # 06:12 UTC — about 07:12 in Zürich in winter, 08:12 in summer.
    # (GitHub cron is UTC only and cannot follow daylight saving.)
    # The odd minute is deliberate: jobs scheduled on the hour queue behind
    # everyone else's and get delayed.
    - cron: '12 6 * * *'
  workflow_dispatch: {}     # lets you fire one by hand from the Actions tab
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: send the morning horoscope
        env:
          BIRTH: ${{ secrets.BIRTH }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          APP_URL: ${{ vars.APP_URL }}
        run: node tools/daily-push.js
