name: refresh satellite elements
on:
  schedule:
    - cron: '17 5 * * 1'   # Mondays 05:17 UTC — the satellites drift, the repo keeps up
  workflow_dispatch: {}     # or run it by hand from the Actions tab
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/refresh-tles.js
      - name: commit if changed
        run: |
          git config user.name "orbital-oracle-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/tle-fallback.js
          git diff --cached --quiet || git commit -m "chore: refresh bundled satellite elements"
          git push
